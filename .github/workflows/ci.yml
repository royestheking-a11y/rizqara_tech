name: Project checks
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:8.0
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
      - run: npm ci
      - run: npm ci --prefix server
      - run: npm run check
        env:
          TEST_MONGODB_URI: mongodb://127.0.0.1:27017
      - run: npm audit --audit-level=moderate
      - run: npm audit --prefix server --audit-level=moderate
