name: Keep Backend Alive

on:
  schedule:
    - cron: '*/5 * * * *' # Every 5 minutes to beat Render's 15m sleep
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Backend Multi-Endpoints
        run: |
          URL="https://rizqaratech-backend.onrender.com"
          echo "Pinging $URL/health..."
          curl --fail --show-error --max-time 15 --retry 2 "$URL/health"
          echo "Pinging $URL/ping..."
          curl --fail --show-error --max-time 15 --retry 2 "$URL/ping"
          echo "Pinging $URL/api/health..."
          curl --fail --show-error --max-time 15 --retry 2 "$URL/api/health"
